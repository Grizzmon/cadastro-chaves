<!doctype html><html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · Cadastro de Chave</title><link rel="stylesheet" href="./style.css"></head><body><main class="shell"><header><div class="brand">✦ Administração</div><a href="./index.html">Voltar ao formulário</a></header><section class="panel" id="login"><span class="tag">ACESSO RESTRITO</span><h1>Entrar</h1><p>Área reservada ao administrador autorizado.</p><form id="loginForm"><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Palavra-passe<input name="password" type="password" autocomplete="current-password" required></label><button>Entrar</button><p id="loginMsg" role="status"></p></form></section><section class="panel hidden" id="dashboard" style="max-width:100%"><div class="tools"><h1 style="margin-right:auto">Painel de nomes</h1><button id="sair">Sair</button></div><div class="stats"><div class="stat">Total<strong id="total">0</strong></div><div class="stat">Hoje<strong id="hoje">0</strong></div><div class="stat">Nomes únicos<strong id="unicos">0</strong></div><div class="stat">Repetições<strong id="repetidos">0</strong></div></div><div class="tools"><input id="busca" placeholder="Pesquisar nome"><button id="exportar">Exportar CSV</button><button id="recarregar">Atualizar</button></div><div class="tablewrap"><table><thead><tr><th>Nome completo</th><th>Data</th><th>Estado</th></tr></thead><tbody id="linhas"></tbody></table></div><p id="status" role="status"></p></section></main><script type="module" src="./admin.js"></script></body></html>
