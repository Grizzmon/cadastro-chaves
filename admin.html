<!doctype html><html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · Votação</title><link rel="stylesheet" href="./style.css"></head><body><main class="shell"><header><div class="brand">✦ Administração</div><a href="./index.html">Voltar à votação</a></header><section class="panel" id="login"><span class="tag">ACESSO RESTRITO</span><h1>Entrar</h1><form id="loginForm"><label>Email<input name="email" type="email" required></label><label>Palavra-passe<input name="password" type="password" required></label><button>Entrar</button><p id="loginMsg" role="status"></p><a href="./recuperar.html">Esqueci a palavra-passe</a></form></section><section class="panel hidden" id="dashboard" style="max-width:100%"><div class="tools"><h1 style="margin-right:auto">Resultados da votação</h1><button id="sair">Sair</button><button id="recarregar">Atualizar</button></div><div class="stats"><div class="stat">Total de votos<strong id="total-votos">0</strong></div><div class="stat">Mais votado<strong id="vencedor">—</strong></div></div><section class="vote-chart-panel" aria-label="Gráfico de votação"><div class="vote-chart-head"><h2>Gráfico dos votos</h2><label for="chart-type">Visualização <select id="chart-type"><option value="bar">Barras</option><option value="pie">Pizza (fatias)</option><option value="donut">Círculo (rosca)</option></select></label></div><div id="vote-chart" role="img" aria-label="Distribuição dos votos"></div><div id="vote-legend" class="vote-legend"></div></section><div class="tablewrap"><table><thead><tr><th>Nome</th><th>Votos</th><th>Percentagem</th></tr></thead><tbody id="votos-linhas"></tbody></table></div><h2>Submissões da fase 1</h2><div class="stats"><div class="stat">Total<strong id="total">0</strong></div><div class="stat">Hoje<strong id="hoje">0</strong></div><div class="stat">Nomes únicos<strong id="unicos">0</strong></div><div class="stat">Repetições<strong id="repetidos">0</strong></div></div><div class="tools"><input id="busca" placeholder="Pesquisar nome"><button id="exportar">Exportar CSV</button></div><div class="tablewrap"><table><thead><tr><th>Nome completo</th><th>Data</th><th>Estado</th></tr></thead><tbody id="linhas"></tbody></table></div><p id="status" role="status"></p></section></main><script type="module" src="./admin.js"></script><script type="module" src="./charts.js"></script></body></html>
