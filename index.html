<!doctype html><html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#111827"><title>Cadastro de Chave</title><link rel="stylesheet" href="./style.css"></head><body><main class="shell"><header><div class="brand">✦ Cadastro de Chave</div><a href="./admin.html">Administração</a></header><section class="panel"><span class="tag">FASE 1 · RECOLHA DE NOMES</span><h1>Registe um nome</h1><p>Preencha os três campos para enviar a sua sugestão. A votação será aberta numa fase posterior.</p><form id="cadastro"><label>Primeiro nome<input name="primeiro_nome" required minlength="2" maxlength="80" autocomplete="given-name"></label><label>Segundo nome<input name="segundo_nome" required minlength="2" maxlength="80"></label><label>Último nome / Sobrenome<input name="sobrenome" required minlength="2" maxlength="80" autocomplete="family-name"></label><button id="enviar" type="submit">Enviar nome</button><p id="mensagem" role="status" aria-live="polite"></p></form></section><footer>Cadastro de Chave · Fase 1</footer></main><script type="module" src="./public.js"></script></body></html>
